spring.application.name=propledger

# ──────────────────────────────────────────────
# DATABASE — All values from environment variables
# Never hardcode credentials here.
# ──────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:propledger}
spring.datasource.username=${DB_USERNAME:propledger}
spring.datasource.password=${DB_PASSWORD:propledger}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP connection pool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=PropLedgerPool

# ──────────────────────────────────────────────
# JPA / Hibernate
# ddl-auto=validate: Hibernate validates schema but does NOT modify it.
# Flyway owns schema management.
# ──────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false

# ──────────────────────────────────────────────
# FLYWAY
# Migrations in classpath:db/migration, named V1__*.sql
# ──────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=false

# ──────────────────────────────────────────────
# JWT
# ──────────────────────────────────────────────
app.jwt.secret=${JWT_SECRET:changeme-propledger-secret-key-min-256-bits-long}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ──────────────────────────────────────────────
# CORS
# ──────────────────────────────────────────────
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# ──────────────────────────────────────────────
# SERVER
# ──────────────────────────────────────────────
server.port=${SERVER_PORT:8080}
server.error.include-message=on-param
server.error.include-stacktrace=never
server.error.include-binding-errors=on-param

# ──────────────────────────────────────────────
# ACTUATOR
# ──────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# ──────────────────────────────────────────────
# LOGGING
# ──────────────────────────────────────────────
logging.level.com.propledger=INFO
logging.level.org.springframework.security=WARN
logging.level.org.flywaydb=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# ──────────────────────────────────────────────
# PAGINATION DEFAULTS
# ──────────────────────────────────────────────
app.pagination.default-page-size=20
app.pagination.max-page-size=100
